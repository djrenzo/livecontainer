name: Sync External Repositories Dynamically

on:
  schedule:
    - cron: '0 2 * * *' # Runs automatically every day at 2:00 AM UTC
  workflow_dispatch: # Allows you to run it manually anytime

permissions:
  contents: write

jobs:
  merge-repositories:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v4

      - name: Download SpotC Feed
        run: |
          TARGET_URL="https://spotc-repo.yodaluca.dev/AltStore%20Repo.json"

          curl -sL "$TARGET_URL" -o spotc_temp.json

          if ! jq -e '.apps' spotc_temp.json > /dev/null; then
            echo "Error: Downloaded file from SpotC is empty or invalid." && exit 1
          fi

      - name: Download Stremio Feed
        run: |
          TARGET_URL="https://blksmr.github.io/altstore-stremio/apps.json"

          curl -sL "$TARGET_URL" -o stremio_temp.json

          if ! jq -e '.apps' stremio_temp.json > /dev/null; then
            echo "Error: Downloaded file from Stremio is empty or invalid." && exit 1
          fi

      - name: Build apps.json from my_apps.json + external feeds
        run: |
          if [ ! -f my_apps.json ]; then
            echo "Error: my_apps.json not found in repo." && exit 1
          fi

          # Always rebuild from my_apps.json so external apps never accumulate.
          # apps.json is a generated output - it does not need to exist beforehand.
          jq --slurpfile spotc spotc_temp.json \
             --slurpfile stremio stremio_temp.json \
             '.apps = (.apps + $spotc[0].apps + $stremio[0].apps)' \
             my_apps.json > apps.json

          rm spotc_temp.json stremio_temp.json

      - name: Commit and Push Combined Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add apps.json

          if git diff --staged --quiet; then
            echo "No upstream repo updates detected."
          else
            git commit -m "Automated Sync: Rebuilt apps.json from my_apps.json + external feeds"
            git push
          fi