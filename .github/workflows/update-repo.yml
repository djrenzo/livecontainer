name: Build Apps.json

on:
  schedule:
    - cron: '17 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-repositories:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v4

      - name: Download SpotC Feed
        run: |
          TARGET_URL="https://spotc-repo.yodaluca.dev/AltStore%20Repo.json"
          curl -sL "$TARGET_URL" -o spotc_temp.json
          if ! jq -e '.apps' spotc_temp.json > /dev/null; then
            echo "Error: Downloaded file from SpotC is empty or invalid." && exit 1
          fi

      - name: Fetch Latest Release from DeltAndy123/YTBetterPlus
        id: ytbetterplus
        run: |
          RELEASE_DATA=$(curl -s "https://api.github.com/repos/DeltAndy123/YTBetterPlus/releases/latest")
          DOWNLOAD_URL=$(echo "$RELEASE_DATA" | jq -r '.assets[] | select(.name | endswith(".ipa")) | .browser_download_url' | head -n 1)
          FILE_SIZE=$(echo "$RELEASE_DATA" | jq -r '.assets[] | select(.name | endswith(".ipa")) | .size' | head -n 1)
          VERSION=$(echo "$RELEASE_DATA" | jq -r '.tag_name')
          PUBLISHED_DATE=$(echo "$RELEASE_DATA" | jq -r '.published_at' | cut -dT -f1)
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" == "null" ]; then
            echo "Error: No IPA found in the latest release of DeltAndy123/YTBetterPlus." && exit 1
          fi
          echo "download_url=$DOWNLOAD_URL" >> $GITHUB_OUTPUT
          echo "file_size=$FILE_SIZE" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "date=$PUBLISHED_DATE" >> $GITHUB_OUTPUT

      - name: Fetch Latest Release from djrenzo/iosappdidi
        id: aperture
        run: |
          RELEASE_DATA=$(curl -s "https://api.github.com/repos/djrenzo/iosappdidi/releases/latest")
          DOWNLOAD_URL=$(echo "$RELEASE_DATA" | jq -r '.assets[] | select(.name | endswith(".ipa")) | .browser_download_url' | head -n 1)
          FILE_SIZE=$(echo "$RELEASE_DATA" | jq -r '.assets[] | select(.name | endswith(".ipa")) | .size' | head -n 1)
          VERSION=$(echo "$RELEASE_DATA" | jq -r '.tag_name' | sed 's/^v//')
          PUBLISHED_DATE=$(echo "$RELEASE_DATA" | jq -r '.published_at' | cut -dT -f1)
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" == "null" ]; then
            echo "Error: No IPA found in the latest release of djrenzo/iosappdidi." && exit 1
          fi
          echo "download_url=$DOWNLOAD_URL" >> $GITHUB_OUTPUT
          echo "file_size=$FILE_SIZE" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "date=$PUBLISHED_DATE" >> $GITHUB_OUTPUT

      - name: Fetch Latest InfusePlus release from this repo
        id: infuse_release
        run: |
          # Get all releases and find the latest one that has an InfusePlus_*.ipa asset
          RELEASE_DATA=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=50")

          RELEASE=$(echo "$RELEASE_DATA" | jq -c \
            '[.[] | select(.assets[] | .name | test("^InfusePlus_.*\\.ipa$"))] | first')

          DOWNLOAD_URL=$(echo "$RELEASE" | jq -r '.assets[] | select(.name | test("^InfusePlus_.*\\.ipa$")) | .browser_download_url' | head -n 1)
          FILE_SIZE=$(echo "$RELEASE" | jq -r '.assets[] | select(.name | test("^InfusePlus_.*\\.ipa$")) | .size' | head -n 1)
          TAG=$(echo "$RELEASE" | jq -r '.tag_name')
          PUBLISHED_DATE=$(echo "$RELEASE" | jq -r '.published_at' | cut -dT -f1)
          # Extract IPA version from tag: infuseplus-v2.5-42-v8.4.5 -> 8.4.5
          IPA_VERSION="${TAG##*-v}"

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" == "null" ]; then
            echo "Warning: No InfusePlus IPA found. Skipping."
            echo "found=false" >> $GITHUB_OUTPUT
          else
            echo "download_url=$DOWNLOAD_URL" >> $GITHUB_OUTPUT
            echo "file_size=$FILE_SIZE" >> $GITHUB_OUTPUT
            echo "version=$IPA_VERSION" >> $GITHUB_OUTPUT
            echo "date=$PUBLISHED_DATE" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
          fi

      - name: Fetch Latest Kodi release from this repo
        id: kodi_release
        run: |
          # Get all releases and find the latest one that has a Kodi_*.ipa asset
          RELEASE_DATA=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=50")

          RELEASE=$(echo "$RELEASE_DATA" | jq -c \
            '[.[] | select(.assets[] | .name | test("^Kodi_.*\\.ipa$"))] | first')

          DOWNLOAD_URL=$(echo "$RELEASE" | jq -r '.assets[] | select(.name | test("^Kodi_.*\\.ipa$")) | .browser_download_url' | head -n 1)
          FILE_SIZE=$(echo "$RELEASE" | jq -r '.assets[] | select(.name | test("^Kodi_.*\\.ipa$")) | .size' | head -n 1)
          TAG=$(echo "$RELEASE" | jq -r '.tag_name')
          PUBLISHED_DATE=$(echo "$RELEASE" | jq -r '.published_at' | cut -dT -f1)
          # Extract version from tag: kodi-v21.3 -> 21.3
          KODI_VERSION="${TAG#kodi-v}"

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" == "null" ]; then
            echo "Warning: No Kodi IPA found. Skipping."
            echo "found=false" >> $GITHUB_OUTPUT
          else
            echo "download_url=$DOWNLOAD_URL" >> $GITHUB_OUTPUT
            echo "file_size=$FILE_SIZE" >> $GITHUB_OUTPUT
            echo "version=$KODI_VERSION" >> $GITHUB_OUTPUT
            echo "date=$PUBLISHED_DATE" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
          fi

      - name: Build apps.json from my_apps.json + external feeds
        run: |
          if [ ! -f my_apps.json ]; then
            echo "Error: my_apps.json not found in repo." && exit 1
          fi
          jq --slurpfile spotc spotc_temp.json \
             '.apps = (.apps + $spotc[0].apps)' \
             my_apps.json > apps.json
          rm spotc_temp.json

      - name: Inject YTBetterPlus latest release into apps.json
        run: |
          URL="${{ steps.ytbetterplus.outputs.download_url }}"
          SIZE=${{ steps.ytbetterplus.outputs.file_size }}
          VER="${{ steps.ytbetterplus.outputs.version }}"
          DT="${{ steps.ytbetterplus.outputs.date }}"
          jq --arg url "$URL" \
             --argjson size "$SIZE" \
             --arg ver "$VER" \
             --arg dt "$DT" \
             --arg bid "com.google.ios.youtube.app" \
             '(.apps[] | select(.bundleIdentifier == $bid) | .versions[0]) = {version: $ver, date: $dt, downloadURL: $url, size: $size}' \
             apps.json > tmp.json && mv tmp.json apps.json

      - name: Inject Aperture latest release into apps.json
        run: |
          URL="${{ steps.aperture.outputs.download_url }}"
          SIZE=${{ steps.aperture.outputs.file_size }}
          VER="${{ steps.aperture.outputs.version }}"
          DT="${{ steps.aperture.outputs.date }}"
          jq --arg url "$URL" \
             --argjson size "$SIZE" \
             --arg ver "$VER" \
             --arg dt "$DT" \
             --arg bid "com.djrenzo.aperture" \
             '(.apps[] | select(.bundleIdentifier == $bid) | .versions[0]) = {version: $ver, date: $dt, downloadURL: $url, size: $size}' \
             apps.json > tmp.json && mv tmp.json apps.json

      - name: Inject InfusePlus latest release into apps.json
        if: steps.infuse_release.outputs.found == 'true'
        run: |
          URL="${{ steps.infuse_release.outputs.download_url }}"
          SIZE=${{ steps.infuse_release.outputs.file_size }}
          VER="${{ steps.infuse_release.outputs.version }}"
          DT="${{ steps.infuse_release.outputs.date }}"
          jq --arg url "$URL" \
             --argjson size "$SIZE" \
             --arg ver "$VER" \
             --arg dt "$DT" \
             --arg bid "com.djrenzo.infuse" \
             '(.apps[] | select(.bundleIdentifier == $bid) | .versions[0]) = {version: $ver, date: $dt, downloadURL: $url, size: $size}' \
             apps.json > tmp.json && mv tmp.json apps.json

      - name: Inject Kodi latest release into apps.json
        if: steps.kodi_release.outputs.found == 'true'
        run: |
          URL="${{ steps.kodi_release.outputs.download_url }}"
          SIZE=${{ steps.kodi_release.outputs.file_size }}
          VER="${{ steps.kodi_release.outputs.version }}"
          DT="${{ steps.kodi_release.outputs.date }}"
          jq --arg url "$URL" \
             --argjson size "$SIZE" \
             --arg ver "$VER" \
             --arg dt "$DT" \
             --arg bid "org.xbmc.kodi-ios.app" \
             '(.apps[] | select(.bundleIdentifier == $bid) | .versions[0]) = {version: $ver, date: $dt, downloadURL: $url, size: $size}' \
             apps.json > tmp.json && mv tmp.json apps.json

      - name: Commit and Push Combined Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add apps.json
          if git diff --staged --quiet; then
            echo "No upstream repo updates detected."
          else
            git commit -m "Automated Sync: Rebuilt apps.json from all sources"
            git push
          fi
