name: Auto-Update External IPA Source

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight UTC
  workflow_dispatch: # Allows you to run this manually anytime with a click

permissions:
  contents: write # Allows the action to write updates back to your apps.json

jobs:
  update-apps-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v4

      - name: Fetch Latest Release Data from Target
        id: get_release
        run: |
          TARGET_REPO="DeltAndy123/YTBetterPlus"
          
          # Query GitHub API for the latest release
          RELEASE_DATA=$(curl -s "https://api.github.com/repos/$TARGET_REPO/releases/latest")
          
          # Find the first asset matching .ipa
          DOWNLOAD_URL=$(echo "$RELEASE_DATA" | jq -r '.assets[] | select(.name | endswith(".ipa")) | .browser_download_url' | head -n 1)
          FILE_SIZE=$(echo "$RELEASE_DATA" | jq -r '.assets[] | select(.name | endswith(".ipa")) | .size' | head -n 1)
          VERSION=$(echo "$RELEASE_DATA" | jq -r '.tag_name')
          PUBLISHED_DATE=$(echo "$RELEASE_DATA" | jq -r '.published_at' | cut -d'T' -f1)

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" == "null" ]; then
            echo "Error: No IPA found in the latest release of $TARGET_REPO." && exit 1
          fi

          echo "download_url=$DOWNLOAD_URL" >> $GITHUB_OUTPUT
          echo "file_size=$FILE_SIZE" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "date=$PUBLISHED_DATE" >> $GITHUB_OUTPUT

      - name: Update apps.json File
        run: |
          # Load parameters from the previous step
          URL="${{ steps.get_release.outputs.download_url }}"
          SIZE=${{ steps.get_release.outputs.file_size }}
          VER="${{ steps.get_release.outputs.version }}"
          DT="${{ steps.get_release.outputs.date }}"
          
          # Use jq to surgically update the first app's latest version array block
          jq --arg url "$URL" \
             --argjson size "$SIZE" \
             --arg ver "$VER" \
             --arg dt "$DT" \
             '.apps[0].versions[0] = {version: $ver, date: $dt, downloadURL: $url, size: $size}' \
             apps.json > tmp.json && mv tmp.json apps.json

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add apps.json
          
          # Commit only if there are changes to avoid endless workflow loops
          if git diff --quiet && git diff --staged --quiet; then
            echo "No new updates found."
          else
            git commit -m "Auto-updated tracker app to version ${{ steps.get_release.outputs.version }}"
            git push
          fi
